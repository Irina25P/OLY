name: E2E Integration Tests

on:
  push:
    branches: [ main, 'BE/**', 'FE/**' ]
  pull_request:
    branches: [ main ]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create logs directory
        run: mkdir -p logs

      - name: Run E2E Suite
        run: |
          docker compose -f docker-compose-e2e.yml up --build --exit-code-from e2e-tests --attach e2e-tests

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose-e2e.yml down -v