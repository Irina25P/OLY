
spring.application.name=ProductMicroservice

###############################################
### DATABASE CONNECTIVITY CONFIGURATIONS ###
###############################################
database.ip = ${DB_IP:92.5.49.167}
database.port = ${DB_PORT:5432}
database.user = ${DB_USER:admin}
database.password = ${DB_PASSWORD:admin}
database.name = ${DB_DBNAME:db_products}

spring.sql.init.platform=postgres
spring.datasource.url = jdbc:postgresql://${database.ip}:${database.port}/${database.name}
spring.datasource.username = ${database.user}
spring.datasource.password = ${database.password}

# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto = update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.show_sql=true
server.tomcat.threads.max = 1


###############################################
### LOGGING CONFIGURATIONS ###
###############################################
logging.level.root=warn
logging.level.org.springframework=warn
logging.level.ro.tuc=warn


###############################################
### EMBEDDED TOMCAT CONFIGURATIONS ###
###############################################
server.port=${PORT:8080}



###############################################
### SECURITY HEADER CONFIGURATIONS ###
###############################################
security.user-id-header=${SECURITY_USER_ID_HEADER:UserId-Header}
security.role-header=${SECURITY_ROLE_HEADER:Role-Header}
security.username-header=${SECURITY_USERNAME_HEADER:Username-Header}

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

rabbitmq.sync.exchange.product.topic=${RABBITMQ_SYNC_EXCHANGE_PRODUCT_TOPIC:product-Topic-Exchange}

rabbitmq.sync.routingkey.addProduct=${RABBITMQ_SYNC_ROUTINGKEY_ADDPRODUCT:addProduct}
rabbitmq.sync.routingkey.updateProduct=${RABBITMQ_SYNC_ROUTINGKEY_UPDATEPRODUCT:updateProduct}
rabbitmq.sync.routingkey.deleteProduct=${RABBITMQ_SYNC_ROUTINGKEY_DELETEPRODUCT:deleteProduct}

rabbitmq.sync.exchange.deleteImage.topic=${RABBITMQ_SYNC_EXCHANGE_DELETEIMAGE_TOPIC:deleteImage-Topic-Exchange}
rabbitmq.sync.routingkey.deleteImage=${RABBITMQ_SYNC_ROUTINGKEY_DELETEIMAGE:deleteImage}

rabbitmq.sync.exchange.changeStock.topic=${RABBITMQ_SYNC_EXCHANGE_CHANGESTOCK_TOPIC:changeStock-Topic-Exchange}
rabbitmq.sync.routingKey.changeStock=${RABBITMQ_SYNC_ROUTINGKEY_CHANGESTOCK:changeStock}

rabbitmq.sync.exchange.notification.topic=${RABBITMQ_SYNC_EXCHANGE_NOTIFICATION_TOPIC:notification-Topic-Exchange}
rabbitmq.sync.routingkey.reviewCreated=${RABBITMQ_SYNC_ROUTINGKEY_REVIEW_CREATED:reviewCreated}

rabbitmq.sync.exchange.user.topic=${RABBITMQ_SYNC_EXCHANGE_USER_TOPIC:user-Topic-Exchange}

rabbitmq.sync.routingkey.client=${RABBITMQ_SYNC_ROUTINGKEY_CLIENT:addUser.client}
rabbitmq.sync.routingkey.seller=${RABBITMQ_SYNC_ROUTINGKEY_SELLER:addUser.seller}
rabbitmq.sync.routingkey.deleteUser=${RABBITMQ_SYNC_ROUTINGKEY_DELETEUSER:deleteUser}

rabbitmq.sync.queue.unique.name=${RABBITMQ_SYNC_UNIQUE_NAME:products-microservice}

rabbitmq.sync.exchange.price.update.topic=${RABBITMQ_SYNC_EXCHANGE_PRICE_UPDATE_TOPIC:price-update-Topic-Exchange}
rabbitmq.sync.routingkey.priceUpdate=${RABBITMQ_SYNC_ROUTINGKEY_PRICE_UPDATE:priceUpdate}