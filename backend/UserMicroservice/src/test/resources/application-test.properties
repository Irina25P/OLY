spring.application.name=UserMicroservice-Test

###############################################
### DATABASE CONNECTIVITY CONFIGURATIONS ###
###############################################
# Use H2 in-memory database for testing
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=true

###############################################
### EMBEDDED TOMCAT CONFIGURATIONS ###
###############################################
server.port=8080

###############################################
### SECURITY HEADER CONFIGURATIONS ###
###############################################
security.user-id-header=UserId-Header
security.role-header=Role-Header
security.username-header=Username-Header

###############################################
### RABBITMQ CONFIGURATIONS ###
###############################################
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Disable RabbitMQ listener in tests
spring.rabbitmq.listener.simple.auto-startup=false

# Topic Exchanges
rabbitmq.sync.exchange.adduser=addUser-Topic-Exchange
rabbitmq.sync.exchange.deleteuser=deleteUser-Topic-Exchange

# Routing Keys for consuming messages
rabbitmq.sync.routingkey.admin=addUser.admin
rabbitmq.sync.routingkey.seller=addUser.seller
rabbitmq.sync.routingkey.client=addUser.client

# Routing Key for producing deleteUser messages
rabbitmq.sync.routingkey.deleteuser=deleteUser

# Unique identifier for queue naming
rabbitmq.sync.unique.name=user-microservice-test

