spring.application.name=NotificationMicroservice

###############################################
### DATABASE CONNECTIVITY CONFIGURATIONS ###
###############################################
database.ip = ${DB_IP:92.5.49.167}
database.port = ${DB_PORT:5432}
database.user = ${DB_USER:admin}
database.password = ${DB_PASSWORD:admin}
database.name = ${DB_DBNAME:db_notifications}

spring.sql.init.platform=postgres
spring.datasource.url = jdbc:postgresql://${database.ip}:${database.port}/${database.name}
spring.datasource.username = ${database.user}
spring.datasource.password = ${database.password}

# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto = update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.show_sql=true
server.tomcat.threads.max = 1


###############################################
### LOGGING CONFIGURATIONS ###
###############################################
logging.level.root=warn
logging.level.org.springframework=warn
logging.level.ro.tuc=warn



###############################################
### EMBEDDED TOMCAT CONFIGURATIONS ###
###############################################
server.port=${PORT:8080}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

rabbitmq.sync.exhange.notification.topic=${RABBITMQ_SYNC_EXCHANGE_NOTIFICATION_TOPIC:notification-Topic-Exchange}

rabbitmq.sync.routingkey.orderCreated=${RABBITMQ_SYNC_ROUTINGKEY_ORDER_CREATED:orderCreated}
rabbitmq.sync.routingkey.orderUpdated=${RABBITMQ_SYNC_ROUTINGKEY_ORDER_UPDATED:orderUpdated}
rabbitmq.sync.routingkey.reviewCreated=${RABBITMQ_SYNC_ROUTINGKEY_REVIEW_CREATED:reviewCreated}

rabbitmq.sync.queue.unique.name=${RABBITMQ_SYNC_UNIQUE_NAME:notification-microservice}

security.username-header=${SECURITY_USERNAME_HEADER:X-User-Id}
security.role-header=${SECURITY_ROLE_HEADER:X-User-Role}

websocket.endpoint=${WEBSOCKET_ENDPOINT:/ws}
websocket.application-prefix=${WEBSOCKET_APPLICATION_PREFIX:/app}
websocket.broker-prefix=${WEBSOCKET_BROKER_PREFIX:/topic}
websocket.user-prefix=${WEBSOCKET_USER_PREFIX:/user}

