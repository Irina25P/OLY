spring.application.name=RecommendationMicroservice

###############################################
### NEO4J CONFIGURATIONS ###
###############################################
spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USER:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:password123}

###############################################
### LOGGING CONFIGURATIONS ###
###############################################
logging.level.root=warn
logging.level.org.springframework=warn

###############################################
### EMBEDDED TOMCAT CONFIGURATIONS ###
###############################################
server.port=${PORT:8080}
server.tomcat.threads.max=1

###############################################
### SECURITY HEADER CONFIGURATIONS ###
###############################################
security.user-id-header=${SECURITY_USER_ID_HEADER:UserId-Header}
security.role-header=${SECURITY_ROLE_HEADER:Role-Header}
security.username-header=${SECURITY_USERNAME_HEADER:Username-Header}

###############################################
### RABBITMQ CONFIGURATIONS ###
###############################################
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

rabbitmq.sync.exchange.order.event.topic=${RABBITMQ_SYNC_EXCHANGE_ORDER_EVENT_TOPIC:order-event-Topic-Exchange}
rabbitmq.sync.routingkey.orderEvent=${RABBITMQ_SYNC_ROUTINGKEY_ORDER_EVENT:orderEvent}

rabbitmq.sync.exchange.product.topic=${RABBITMQ_SYNC_EXCHANGE_PRODUCT_TOPIC:product-Topic-Exchange}
rabbitmq.sync.routingkey.addProduct=${RABBITMQ_SYNC_ROUTINGKEY_ADDPRODUCT:addProduct}
rabbitmq.sync.routingkey.updateProduct=${RABBITMQ_SYNC_ROUTINGKEY_UPDATEPRODUCT:updateProduct}
rabbitmq.sync.routingkey.deleteProduct=${RABBITMQ_SYNC_ROUTINGKEY_DELETEPRODUCT:deleteProduct}

rabbitmq.sync.queue.unique.name=${RABBITMQ_SYNC_UNIQUE_NAME:recommendation-service}
