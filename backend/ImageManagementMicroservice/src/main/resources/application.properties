spring.application.name=ImageManagementMicroservice

server.forward-headers-strategy=framework
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

###############################################
### MINIO CONNECTIVITY CONFIGURATIONS ###
###############################################
minio.ip = ${MINIO_IP:92.5.49.167}
minio.port = ${MINIO_PORT:9000}
minio.accessKey=${MINIO_ACCESS_KEY:admin}
minio.secretKey=${MINIO_SECRET_KEY:admin}
minio.bucketName=${MINIO_BUCKET_NAME:disi-images}
minio.url=http://${minio.ip}:${minio.port}

###############################################
### LOGGING CONFIGURATIONS ###
###############################################
logging.level.root=warn
logging.level.org.springframework=warn
logging.level.ro.tuc=warn



###############################################
### EMBEDDED TOMCAT CONFIGURATIONS ###
###############################################
server.port=${PORT:8080}



###############################################
### RabbitMQ Configuration ###
###############################################
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

rabbitmq.sync.exchange.deleteImages.topic=${RABBITMQ_SYNC_EXCHANGE_DELETEIMAGE_TOPIC:deleteImage-Topic-Exchange}
rabbitmq.sync.exchange.deleteImages.routingkey=${RABBITMQ_SYNC_ROUTINGKEY_DELETEIMAGE:deleteImages}

rabbitmq.sync.queue.unique.name=${RABBITMQ_SYNC_UNIQUE_NAME:image-microservice}


