spring.application.name=AuthMicroservice

###############################################
### DATABASE CONNECTIVITY CONFIGURATIONS ###
###############################################
database.ip = ${DB_IP:localhost}
database.port = ${DB_PORT:5432}
database.user = ${DB_USER:admin}
database.password = ${DB_PASSWORD:admin}
database.name = ${DB_DBNAME:db_auth}

spring.sql.init.platform=postgres
spring.datasource.url = jdbc:postgresql://${database.ip}:${database.port}/${database.name}
spring.datasource.username = ${database.user}
spring.datasource.password = ${database.password}

# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto = update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.show_sql=true
server.tomcat.threads.max = 1


###############################################
### LOGGING CONFIGURATIONS ###
###############################################
logging.level.root=warn
logging.level.org.springframework=warn
logging.level.ro.tuc=warn



###############################################
### EMBEDDED TOMCAT CONFIGURATIONS ###
###############################################
server.port=${PORT:8080}



###############################################
### JWT configuration ###
###############################################
jwt.secret=${JWT_SECRET_TOKEN:O4/hhlvFjaIftjZ7R1/pfbN+FT6A0cp5rfRm8pZHKbU=}

security.username.header=${SECURITY_USERNAME_HEADER:Username-Header}
security.role.header=${SECURITY_ROLE_HEADER:Role-Header}
security.user.id.header=${SECURITY_USER_ID_HEADER:UserId-Header}



###############################################
### RabbitMQ Configuration ###
###############################################
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

rabbitmq.sync.exchange.addUser.topic=${RABBITMQ_SYNC_EXCHANGE_ADDUSER_TOPIC:addUser-Topic-Exchange}
rabbitmq.sync.exchange.deleteUser.topic=${RABBITMQ_SYNC_EXCHANGE_DELETEUSER_TOPIC:deleteUser-Topic-Exchange}

# Routing keys for topic exchange
rabbitmq.sync.routingkey.admin=${RABBITMQ_SYNC_ROUTINGKEY_ADMIN:addUser.admin}
rabbitmq.sync.routingkey.seller=${RABBITMQ_SYNC_ROUTINGKEY_SELLER:addUser.seller}
rabbitmq.sync.routingkey.client=${RABBITMQ_SYNC_ROUTINGKEY_CLIENT:addUser.client}
rabbitmq.sync.routingkey.deleteUser=${RABBITMQ_SYNC_ROUTINGKEY_DELETEUSER:deleteUser}

rabbitmq.sync.queue.unique.name=${RABBITMQ_SYNC_UNIQUE_NAME:auth-microservice}
