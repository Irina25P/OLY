upstream backend{
    server ${BACKEND}:8080       max_fails=3 fail_timeout=240s;
}


server {

    listen  80;
    server_name  localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

     location /api/ {
        proxy_pass http://backend;
    }
}